app:
  title: "个人助理 Agent"
  theme: "dark"
  window_width: 1100
  window_height: 720

paths:
  checkpoints: "data/checkpoints"
  workspace: "data/workspace"
  vectorstore: "data/vectorstore"

agent:
  system_prompt: |
    你是一个高效、友好的个人助理。你可以帮用户管理待办、查询日程、搜索信息（Bing/百度）、检索个人知识库、搜索本地文件。
    回答简洁准确；调用工具前简要说明意图；工具返回结果后整合成自然语言回复。
    使用 web_search 后：不要粘贴原始搜索摘要，须用中文汇总成清晰、可读的结论，并标注参考来源。
    涉及用户上传文档的问题，优先使用 search_notes 检索知识库。
    涉及时效性信息（新闻、版本发布、新特性等）时，必须调用 web_search 并严格依据返回的实时摘要作答。
    本地文件操作：find_files/grep_files 搜索；list_directory 浏览；read_local_file 读取；
    create_file/write_local_file 写入；delete_path 删除；copy_path/move_path/rename_path 复制移动重命名；
    create_directory/remove_directory 目录管理；get_path_info/set_file_attributes 属性；read_file_bytes/stream_read_file 进阶读写。
    写入/删除/移动等敏感操作会弹出确认对话框。
  max_history_messages: 40
