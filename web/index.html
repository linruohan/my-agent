<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人助理 Agent</title>
  <link rel="stylesheet" href="css/fonts-lxgw.css" />
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/calendar.css" />
  <script src="js/vendor/marked.min.js"></script>
</head>
<body>
  <div id="app" class="app">
    <aside class="sidebar">
      <button type="button" class="sidebar-calendar" id="sidebar-calendar" title="打开万年历">
        <span class="sidebar-cal-icon" aria-hidden="true">📅</span>
        <div class="sidebar-cal-body">
          <div class="sidebar-cal-date">—</div>
          <div class="sidebar-cal-lunar">—</div>
          <div class="sidebar-cal-sub"></div>
        </div>
        <span class="sidebar-cal-day-num">—</span>
      </button>
      <div class="sidebar-header">
        <h1 class="sidebar-title">会话</h1>
      </div>
      <button type="button" class="btn btn-secondary sidebar-btn" id="btn-new-session">＋ 新会话</button>
      <div class="session-list" id="session-list">
        <div class="session-item active">当前会话</div>
      </div>
      <div class="sidebar-footer">
        <button type="button" class="btn btn-secondary sidebar-btn" id="btn-knowledge">📚 导入文档</button>
        <button type="button" class="btn btn-secondary sidebar-btn" id="btn-settings">⚙ 设置</button>
      </div>
    </aside>

    <main class="main">
      <div class="chat-surface">
        <div class="chat-scroll" id="chat-scroll"></div>
      </div>

      <div class="composer-dock" id="composer-dock">
        <div class="attachment-strip hidden" id="attachment-strip"></div>
        <div class="composer-pill" id="composer-pill">
          <div class="pill-left">
            <button type="button" class="pill-btn pill-add" id="btn-attach" title="添加附件">+</button>
            <div class="attach-menu hidden" id="attach-menu">
              <button type="button" id="attach-pick-image">🖼 图片</button>
              <button type="button" id="attach-pick-file">📎 文件</button>
              <button type="button" id="attach-add-link">🔗 链接</button>
            </div>
          </div>
          <textarea
            id="input-box"
            class="pill-input"
            rows="1"
            placeholder="输入追问… 输入 / 查看命令，↑↓ 历史"
          ></textarea>
          <div class="slash-menu hidden" id="slash-menu"></div>
          <button type="button" class="pill-voice" id="btn-voice" title="语音输入 (Windows)">
            <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/>
            </svg>
          </button>
          <button type="button" class="pill-action" id="btn-action" title="发送">
            <svg class="icon-send" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M12 19V5M12 5l-6 6M12 5l6 6"/>
            </svg>
            <svg class="icon-stop hidden" viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="1" fill="currentColor"/>
            </svg>
          </button>
        </div>
        <div class="composer-meta">
          <span class="meta-item meta-hint" id="composer-hint"></span>
        </div>
      </div>

      <footer class="status-bar hidden" id="status-bar"></footer>
    </main>
  </div>

  <!-- 设置 -->
  <dialog class="modal" id="settings-modal">
    <form method="dialog" class="modal-panel" id="settings-form">
      <header class="modal-header">
        <h2>设置</h2>
        <button type="button" class="btn-icon" id="settings-close" aria-label="关闭">✕</button>
      </header>
      <div class="modal-body">
        <section class="form-section">
          <h3>外观</h3>
          <label class="field">
            <span>主题</span>
            <select id="theme-select"></select>
          </label>
          <label class="field">
            <span>明暗模式</span>
            <select id="appearance-select">
              <option value="system">跟随系统</option>
              <option value="light">浅色</option>
              <option value="dark">深色</option>
            </select>
          </label>
          <label class="field">
            <span>全局字体</span>
            <select id="font-select"></select>
          </label>
        </section>
        <section class="form-section">
          <h3>任务</h3>
          <label class="field">
            <span>默认负责人（/tsk add 未指定 @{owner} 时使用）</span>
            <input type="text" id="task-owner-input" placeholder="林若寒" />
          </label>
        </section>
        <section class="form-section">
          <h3>LLM</h3>
          <label class="field">
            <span>提供商</span>
            <select id="provider-select"></select>
          </label>
          <label class="field">
            <span>模型</span>
            <input type="text" id="model-input" />
          </label>
          <label class="field">
            <span>API Base URL</span>
            <input type="text" id="base-url-input" />
          </label>
          <label class="field">
            <span>API Key</span>
            <input type="password" id="api-key-input" placeholder="留空保留已有 Key" />
            <small id="api-key-status" class="hint"></small>
          </label>
          <label class="field">
            <span>Temperature <output id="temp-value">0.7</output></span>
            <input type="range" id="temp-slider" min="0" max="1" step="0.05" value="0.7" />
          </label>
        </section>
        <section class="form-section">
          <h3>Skill 目录</h3>
          <label class="field">
            <span>Skill 路径（每行一个）</span>
            <textarea id="skill-dirs-input" rows="3" placeholder="C:\Users\you\.cursor\skills-cursor"></textarea>
            <small class="hint">输入 / 时将显示 tools 命令与 Skill 列表</small>
          </label>
        </section>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-muted" id="settings-cancel">取消</button>
        <button type="submit" class="btn btn-primary">保存</button>
      </footer>
    </form>
  </dialog>

  <!-- HITL 确认 -->
  <dialog class="modal" id="confirm-modal">
    <div class="modal-panel confirm-panel">
      <header class="modal-header">
        <h2 id="confirm-title">操作确认</h2>
      </header>
      <div class="modal-body">
        <p id="confirm-description" class="confirm-text"></p>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-muted" id="confirm-cancel">取消</button>
        <button type="button" class="btn btn-primary" id="confirm-ok">确认执行</button>
      </footer>
    </div>
  </dialog>

  <!-- 会话重命名 -->
  <dialog class="modal session-rename-modal" id="session-rename-modal">
    <form method="dialog" class="modal-panel session-rename-panel" id="session-rename-form">
      <div class="modal-body session-rename-body">
        <label class="field session-rename-field">
          <span>会话名称</span>
          <input
            type="text"
            id="session-rename-input"
            maxlength="64"
            autocomplete="off"
            placeholder="输入会话名称…"
          />
        </label>
        <p class="session-rename-hint">按 Enter 保存，Esc 取消</p>
      </div>
      <footer class="modal-footer session-rename-footer">
        <button type="button" class="btn btn-muted" id="session-rename-cancel">取消</button>
        <button type="submit" class="btn btn-primary" id="session-rename-save">保存</button>
      </footer>
    </form>
  </dialog>

  <!-- 万年历 -->
  <dialog class="modal calendar-modal" id="calendar-modal">
    <div class="modal-panel calendar-panel">
      <header class="modal-header">
        <h2>万年历</h2>
        <button type="button" class="btn-icon" id="cal-close" aria-label="关闭">✕</button>
      </header>
      <div class="calendar-layout">
        <section class="calendar-grid-section">
          <div class="cal-toolbar">
            <button type="button" class="cal-nav-btn" id="cal-prev-month" aria-label="上个月">◀</button>
            <span class="cal-month-label" id="cal-month-label">—</span>
            <button type="button" class="cal-nav-btn" id="cal-next-month" aria-label="下个月">▶</button>
            <button type="button" class="cal-today-btn" id="cal-today-btn">今天</button>
          </div>
          <div class="cal-week-head" id="cal-week-head"></div>
          <div class="cal-grid" id="cal-grid"></div>
        </section>
        <section class="calendar-detail-section">
          <div class="cal-detail-header" id="cal-detail-header">—</div>
          <div class="cal-today-tag hidden" id="cal-today-tag">今天</div>
          <span class="cal-holiday-tag hidden" id="cal-holiday-tag"></span>
          <div class="cal-day-nav">
            <button type="button" class="cal-day-arrow" id="cal-prev-day" aria-label="前一天">◀</button>
            <span class="cal-big-day" id="cal-big-day">—</span>
            <button type="button" class="cal-day-arrow" id="cal-next-day" aria-label="后一天">▶</button>
          </div>
          <div class="cal-lunar-info" id="cal-lunar-info">—</div>
          <div class="cal-ganzhi" id="cal-ganzhi">—</div>
          <div class="cal-yiji">
            <div class="cal-yiji-row">
              <span class="cal-yiji-label yi">宜</span>
              <span class="cal-yiji-text" id="cal-yi">—</span>
            </div>
            <div class="cal-yiji-row">
              <span class="cal-yiji-label ji">忌</span>
              <span class="cal-yiji-text" id="cal-ji">—</span>
            </div>
          </div>
          <div class="cal-jieqi">
            <div id="cal-prev-jieqi"></div>
            <div id="cal-next-jieqi"></div>
          </div>
        </section>
      </div>
    </div>
  </dialog>

  <!-- 知识库 -->
  <dialog class="modal" id="knowledge-modal">
    <div class="modal-panel">
      <header class="modal-header">
        <h2>知识库管理</h2>
        <button type="button" class="btn-icon" id="knowledge-close" aria-label="关闭">✕</button>
      </header>
      <div class="modal-body">
        <pre id="knowledge-stats" class="knowledge-stats"></pre>
        <p class="hint">支持 .txt / .md / .pdf / .docx</p>
        <div class="modal-actions-row">
          <button type="button" class="btn btn-secondary" id="knowledge-pick-files">选择文件</button>
          <button type="button" class="btn btn-secondary" id="knowledge-pick-folder">选择文件夹</button>
        </div>
        <pre id="knowledge-log" class="knowledge-log"></pre>
      </div>
      <footer class="modal-footer">
        <button type="button" class="btn btn-muted" id="knowledge-done">关闭</button>
      </footer>
    </div>
  </dialog>

  <script src="js/vendor/lunar.js"></script>
  <script src="js/holidays.js"></script>
  <script src="js/calendar.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/composer.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
