[project]
name = "my-agent"
version = "0.1.0"
description = "个人助理 Agent — LangChain + LangGraph + pywebview"
readme = "个人助理Agent设计文档.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.3",
    "langgraph>=0.3",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-openai>=0.3",
    "langchain-community>=0.3",
    "langchain-text-splitters>=0.3",
    "customtkinter>=5.2",
    "pywebview>=5.0",
    "pyyaml>=6.0",
    "keyring>=25.0",
    "loguru>=0.7",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "faiss-cpu>=1.8",
    "fastembed>=0.4",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
my-agent = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
